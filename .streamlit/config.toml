[theme]
base = "dark"
primaryColor = "#00F0FF"
backgroundColor = "#07090D"
secondaryBackgroundColor = "#0E1117"
textColor = "#F5F5F7"

[server]
headless = true
# CORS y XSRF quedan con sus valores por defecto (activados). No desactivarlos
# para "arreglar" la vista previa: si el iframe de Replit no conecta, primero
# identificar la causa (ver README, sección Replit).

[browser]
gatherUsageStats = false
