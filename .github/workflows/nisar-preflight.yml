name: NISAR GCOV - inundaciones - preflight sin descargar

on:
  push:
    branches: [feature/nisar-inundaciones-auto]
  pull_request:
    paths:
      - "utils/nisar_*.py"
      - "components/nisar_auto_ui.py"
      - "scripts/nisar*.py"
      - "tests/test_nisar*.py"
      - ".github/workflows/nisar-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nisar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VISOR_REGION_MODE: CO
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias para pruebas y lectura GCOV
        run: python -m pip install -r requirements.txt
      - name: Probar catálogo, descarga simulada, lector y selección automática
        run: python -m pytest -q tests/test_nisar_catalogo.py tests/test_nisar_descarga.py tests/test_nisar_gcov.py tests/test_nisar_auto.py tests/test_nisar_harmony.py tests/test_verificar_nisar_harmony_pares.py tests/test_nisar_verificar_punto_qa.py
      - name: Buscar NISAR VALIDATED REAL en ASF/CMR (solo metadatos)
        run: python scripts/nisar_auto.py --inicio 2026-10-21 --fin 2026-11-14 > nisar_preflight_real.json
      - name: Consultar capacidades Harmony GCOV (público, sin token)
        run: python scripts/nisar_harmony_preflight.py | tee harmony_capacidades.json
      - name: Guardar evidencia sin credenciales ni archivos grandes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nisar-asf-preflight-metadata
          path: |
            nisar_preflight_real.json
            harmony_capacidades.json
          if-no-files-found: warn
