name: Investigacion publica ASF y DSWx (solo metadatos)

on:
  push:
    branches:
      - feature/asf-opera-preflight
    paths:
      - scripts/verificar_opera_asf.py
      - scripts/verificar_dswx_cmr.py
      - tests/test_opera_preflight.py
      - tests/test_dswx_preflight.py
      - .github/workflows/preflight-agua.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Agua superficial - catálogo OPERA ASF y PO.DAAC
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar solo cliente de metadatos y pruebas
        run: python -m pip install --disable-pip-version-check pytest asf-search
      - name: Pruebas simuladas sin Internet
        run: python -m pytest -q tests/test_opera_preflight.py tests/test_dswx_preflight.py
      - name: Consultar metadatos reales ASF OPERA RTC-S1
        run: python scripts/verificar_opera_asf.py --salida informes/preflight/opera_asf.json --limite 250
      - name: Consultar metadatos reales NASA PO.DAAC DSWx-S1
        if: always()
        run: python scripts/verificar_dswx_cmr.py --salida informes/preflight/dswx_podaac.json --limite 150
      - name: Guardar evidencia de respuestas (sin imágenes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visor-inundaciones-preflight-metadatos
          path: informes/preflight/*.json
          if-no-files-found: warn
